<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#000"/>

  <!-- ── Geometric mark ── -->

  <!-- Left vertical bar -->
  <line x1="42" y1="30" x2="42" y2="108" stroke="#fff" stroke-width="9" stroke-linecap="square"/>
  <!-- Left bottom diagonal (going right) -->
  <line x1="42" y1="108" x2="72" y2="138" stroke="#fff" stroke-width="9" stroke-linecap="square"/>

  <!-- Top horizontal bar -->
  <line x1="42" y1="30" x2="110" y2="30" stroke="#fff" stroke-width="9" stroke-linecap="square"/>

  <!-- Right chevron — upper arm -->
  <line x1="110" y1="30" x2="148" y2="69" stroke="#fff" stroke-width="9" stroke-linecap="square"/>
  <!-- Right chevron — lower arm -->
  <line x1="148" y1="69" x2="110" y2="108" stroke="#fff" stroke-width="9" stroke-linecap="square"/>

  <!-- Middle connector (left shape to right chevron) -->
  <line x1="42" y1="69" x2="110" y2="69" stroke="#fff" stroke-width="9" stroke-linecap="square"/>

  <!-- ── Numbers ── -->
  <text x="88" y="112"
        text-anchor="middle" fill="#fff"
        font-size="30" font-weight="900"
        font-family="'Arial Black', Impact, Arial, sans-serif"
        letter-spacing="3">28</text>

  <!-- ── Brand text ── -->
  <text x="100" y="162"
        text-anchor="middle" fill="#fff"
        font-size="20" font-weight="700"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="10">STORE</text>

  <!-- Bottom line under STORE -->
  <line x1="38" y1="170" x2="162" y2="170" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
